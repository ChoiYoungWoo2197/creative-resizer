version: '3.8'

services:
  creative-nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creative-nginx
    ports:
      - "3001:80"
    tmpfs:
      - /tmp
    security_opt:
      - label:disable
      - seccomp:unconfined
    depends_on:
      - creative-api
    restart: unless-stopped
    networks:
      - creative-net

  creative-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creative-api
    ports:
      - "18081:8081"
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      # Worker HTTP timeout 설정
      # clean_v1은 spec당 최대 3회 AI 재시도 → 규격 수에 비례해 시간 소요
      - WORKER_CONNECT_TIMEOUT_SECONDS=20
      - WORKER_ANALYSIS_READ_TIMEOUT_SECONDS=120
      - WORKER_GENERATE_READ_TIMEOUT_SECONDS=900
    volumes:
      - ./logs:/logs
      - /opt/creative-resizer/storage:/app/storage
    depends_on:
      - creative-worker
    restart: unless-stopped
    networks:
      - creative-net

  creative-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: creative-worker
    environment:
      - OUTPUT_DIR=/app/storage/outputs
      - ZIP_DIR=/app/storage/zips
      # clean_v1 파이프라인 (P1~P8)
      # P2 객체 분석, P5 배경 생성(images.edit), P6 검증에 사용
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # P2 Claude 분석기 사용 시 필요 (CLEAN_PIPELINE_TYPE=CLAUDE)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MONGODB_URI=${MONGODB_URI}
      # auto: scale + AR 기준으로 규격마다 TYPE B/D 자동 선택
      # B: 항상 TYPE B (GPT-4o 분석 + 요소 재배치)
      # D: 항상 TYPE D (contain-scale + AI border outpaint)
      # CLAUDE: TYPE B 파이프라인 + Claude P2 분석기
      - CLEAN_PIPELINE_TYPE=${CLEAN_PIPELINE_TYPE:-auto}
    volumes:
      - /opt/creative-resizer/storage:/app/storage
    restart: unless-stopped
    networks:
      - creative-net

networks:
  creative-net:
    driver: bridge
